            </p>
          </div>
        </a>

        <a class="hover-card cover-no-title" href="https://www.openbiolab.org/" style="--bg: url('/images/cards/openbio.png');">
          <div class="hover-card__content">
            <h3 class="hover-card__title">Harvard OpenBio</h3>
