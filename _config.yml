         style="--bg: url('/images/cards/chem10.png');">
        <div class="hover-card__content">
          <h3 class="hover-card__title">
            Simulating Super-Resolution Fluorescence Microscopy with Quantum Dots
          </h3>
          <p class="hover-card__body">
            Performed <em>in silico</em> simulations of quantum dot blinking as a novel super-resolution microscopy method.
          </p>
        </div>
      </a>

      <a class="hover-card projects"
