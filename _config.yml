  - title: 🧪 Projects
    layout: text
    content: |
      <div id="projects" class="hover-grid cols-3">

      <a class="hover-card projects"
         href="https://drive.google.com/file/d/1jVz_gRrl2Z6W7DQ15xxsLWaqAAJNtu-U/view?usp=sharing"
         target="_blank"
         rel="noopener"
         style="--bg: url('/images/cards/scrb155.png');">
        <div class="hover-card__content">
          <h3 class="hover-card__title">
            Chronic Expansion Reprograms Memory CD8+ T Cells Toward Poised Exhaustion Without Loss of Proliferative Capacity
          </h3>
          <p class="hover-card__body">
            Reanalyzed longitudinal RNA-seq and ATAC-seq data to show that repeated CD8⁺ T-cell expansion drives epigenetic and transcriptional programs associated with poised exhaustion while preserving proliferative capacity.
          </p>
        </div>
      </a>

      <a class="hover-card projects"
         href="https://drive.google.com/file/d/1SSYbrn09IO8GH8xXDtbaMzTwU0S63l3Q/view?usp=sharing"
