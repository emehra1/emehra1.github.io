              1 of 25 fellows backed by the Academy for Health &amp; Lifespan Research. I directed and hosted TIME Cast, interviewing leaders in aging biology, biotechnology, and policy to get the field's arguments in front of people outside it.
            </p>
          </div>
        </a>

        <a class="hover-card cover-no-title" href="https://norn.group/" style="--bg: url('/images/cards/norn.webp');">
