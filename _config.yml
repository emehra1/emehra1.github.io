              Organized biosecurity journal club and speaker sessions; planned and co-hosted the Future of Biology Conference (130+ attendees; keynotes: George Church, Reshma Shetty).
              Co-led the Harvard Summer Research Institute, matching 73 underserved students to research mentors and publishing their abstracts.
            </p>
          </div>
