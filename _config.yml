about_title: 🧭 About
about_profile_image: images/profile.jpg
about_content: |
  <span id="about"></span>
  Medicine, as I first learned it, arrives at the worst possible moment. It waits for failure, for the tumor, the infarct, the diagnosis, and by the time it acts the biology has been drifting for years, unseen.

  That delay is not a failure of will. It is a failure of sight. In the United States the median cancer diagnosis comes at 66, the first heart attack near 65, dementia at 83. Cure every cancer outright and you add two or three years to average lifespan, fewer of them good, because the same person meets another form of decline. The drivers underneath are shared, gradual, and mostly invisible: regulatory programs inside individual cells drifting off course under environment, stress, and time.

  So I build tools to make that drift legible. The field's problem is not a shortage of signals but a surplus of them, hundreds of correlates and few causes. Separating drivers from passengers means measuring cell state precisely, interpreting it functionally, and intervening in it directly. Without tools, prevention is philosophy. With them, it becomes engineering.

  The other half of the work is that this field is small on purpose. A few thousand scientists and roughly a billion dollars a year sit against the hundreds of billions spent treating disease after the damage is done. Insurers reimburse treatment, not prevention; trials are built around single diseases, not the drivers beneath them. Good ideas die twice, first in the gaps between people who never meet, then against incentives that make prevention nobody's job.

  So I build rooms too. Connective work is not peripheral to this science. In a field this young, it is how the science moves at all.

content:
  - title: 🔬 Research
    layout: text
    content: |
      <span id="research"></span>

      <p>Reading DNA methylation one cell at a time has been expensive enough that most experiments cannot afford the cell numbers real biology requires. With Patrick Griffin in the Buenrostro Lab, I co-developed <strong>scMethyl</strong>, a combinatorial-indexing single-cell methylation assay cheap enough to change which questions are askable, with a median ~97% mapping rate and roughly 540,000 CpGs per cell in K562, validated across human cortex, PBMCs, and cell lines. A second-author manuscript is in preparation.</p>

      <p>I am now extending the platform to read perturbation barcodes and paired RNA in the same cell, which would make possible the first pooled perturbation screens with joint methylation and probe-based RNA profiling as readouts. That is the step from reading the epigenome to testing which of its marks actually do something. My thesis pushes further into writing it: engineering transcription factor interactions for durable epigenetic reprogramming of CD8⁺ T cell exhaustion.</p>

      <div class="hover-grid">

        <a class="hover-card labs" href="https://www.buenrostrolab.com/" style="--bg: url('/images/cards/buenrostro.jpg');">
          <div class="hover-card__content">
            <h3 class="hover-card__title">Buenrostro Lab</h3>
            <p class="hover-card__body">
              With Jason Buenrostro and Patrick Griffin, I co-developed scMethyl, a low-cost combinatorial-indexing assay reading ~540,000 CpGs per cell, and am extending it to capture methylation, RNA, and perturbation barcodes in the same cell.
            </p>
          </div>
        </a>

        <a class="hover-card labs" href="https://www.syntheticimmunity.net/" style="--bg: url('/images/cards/synthetic-immunity.jpg');">
          <div class="hover-card__content">
            <h3 class="hover-card__title">Synthetic Immunity Lab</h3>
            <p class="hover-card__body">
              With Ming-Ru Wu, I built logic-gated circuits inducing an immortalized “zombie T-cell” state in primary murine CD8⁺ T cells, then tested whether those cells resist exhaustion in mice carrying B16F10 melanomas.
            </p>
          </div>
        </a>

        <a class="hover-card labs" href="https://labs.feinberg.northwestern.edu/gao/index.html" style="--bg: url('/images/cards/gao-lab.jpg');">
          <div class="hover-card__content">
            <h3 class="hover-card__title">Gao Lab</h3>
            <p class="hover-card__body">
              With Ruli Gao, I analyzed Nanopore scRNA-seq from patient-matched renal cell carcinomas and their brain metastases, mapping the transcriptional programs of metastatic progression to find targetable tumor and immune populations.
            </p>
          </div>
        </a>

      </div>

