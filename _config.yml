about_content: |
  <span id="about"></span>
  Building and leveraging next-generation omics tools to uncover new levers to reprogram cell fate and restore resilience across the lifespan.

content:
  - title: 🔬 Laboratories
    layout: text
    content: |
      <span id="labs"></span>
      <div class="hover-grid">

        <a class="hover-card" href="#"
           style="--bg: url('/images/cards/buenrostro.jpg'); --cover: rgba(74, 192, 176, 0.55);">
          <div class="hover-card__content">
            <h3 class="hover-card__title">Buenrostro Lab</h3>
            <p class="hover-card__body">
              Engineering a cost-effective, high-throughput single-cell methylation sequencing assay.
            </p>
          </div>
        </a>

        <a class="hover-card" href="#"
           style="--bg: url('/images/cards/synthetic-immunity.jpg'); --cover: rgba(74, 192, 176, 0.55);">
          <div class="hover-card__content">
            <h3 class="hover-card__title">Synthetic Immunity Lab</h3>
            <p class="hover-card__body">
              Designed and constructed cancer-targeting synthetic gene circuits to enhance efficacy, specificity, and persistence of combinatorial immunotherapy.
              Programmed T-cells with logic-gated induction of an immortalized “zombie T-cell” (zT-cell) state to overcome exhaustion in vivo.
              Characterized dynamics of immortalized T cells in vivo and in vitro.
              Mentored by Dr. Ming-Ru Wu, Dept. of Cancer Immunology &amp; Virology.
            </p>
          </div>
        </a>

        <a class="hover-card" href="#"
           style="--bg: url('/images/cards/gao-lab.jpg'); --cover: rgba(74, 192, 176, 0.55);">
          <div class="hover-card__content">
            <h3 class="hover-card__title">Gao Lab</h3>
            <p class="hover-card__body">
              Employed Nanopore scRNA-seq on patient-matched renal cell carcinoma primary tumors and brain metastases to map targetable cell types and markers for metastasis prevention.
              Analyzed tumor/immune gene-expression dynamics during brain-metastasis evolution.
              Awarded 1st Place Poster Presentation by the Beckman Institute of Advanced Science and Technology.
            </p>
          </div>
        </a>

      </div>

  - title: 📚 Leadership and Extracurriculars
    layout: text
    content: |
      <span id="leadership"></span>
      <div class="hover-grid">

        <a class="hover-card cover-no-title" href="#"
           style="--bg: url('/images/cards/time.webp'); --cover: rgba(120, 190, 255, 0.55);">
          <div class="hover-card__content">
            <h3 class="hover-card__title">TIME Initiative</h3>
            <p class="hover-card__body">
              Selected as 1 of 25 fellows supported by the Academy for Health &amp; Lifespan Research; represent youth in aging biology at major conferences; network with leaders in longevity biotech/academia/VC; host podcast episodes.
            </p>
          </div>
        </a>

        <a class="hover-card cover-no-title" href="#"
           style="--bg: url('/images/cards/norn.webp'); --cover: rgba(120, 190, 255, 0.55);">
          <div class="hover-card__content">
            <h3 class="hover-card__title">Nexus Fellowship</h3>
            <p class="hover-card__body">
              Drive translational efforts in age-related disease by leading journal clubs, drafting policy memos, and designing/securing funding for novel experiments.
            </p>
          </div>
        </a>

        <a class="hover-card cover-no-title" href="#"
           style="--bg: url('/images/cards/foa-summit.png'); --cover: rgba(120, 190, 255, 0.55);">
          <div class="hover-card__content">
            <h3 class="hover-card__title">Future of Aging Summit</h3>
            <p class="hover-card__body">
              Hosting an interdisciplinary summit on aging at GSA 2025 (expected 100+ attendees); leading and hosting panels on clinical research in aging and biotech’s role in aging.
            </p>
          </div>
        </a>

        <a class="hover-card cover-no-title" href="#"
           style="--bg: url('/images/cards/aging-initiative.png'); --cover: rgba(120, 190, 255, 0.55);">
          <div class="hover-card__content">
            <h3 class="hover-card__title">Aging Initiative at Harvard</h3>
            <p class="hover-card__body">
              Spearheaded MAST Symposium (Apr 2024) and Boston’s aging-biology mixer (Nov 2024).
              Co-lead a team of 27; manage partnerships/advisors; raised $10,000+ through industry outreach; led professor-dinner series with MIT/Harvard researchers.
            </p>
          </div>
        </a>

        <a class="hover-card cover-no-title" href="#"
           style="--bg: url('/images/cards/gami.png'); --cover: rgba(120, 190, 255, 0.55);">
          <div class="hover-card__content">
            <h3 class="hover-card__title">GAMI</h3>
            <p class="hover-card__body">
              Building a nurse-patient matching mobile app for elderly patients in rural India; mapping delivery bottlenecks and spearheading pilot implementation.
            </p>
          </div>
        </a>

        <a class="hover-card cover-no-title" href="#"
           style="--bg: url('/images/cards/nucleate.png'); --cover: rgba(120, 190, 255, 0.55);">
          <div class="hover-card__content">
            <h3 class="hover-card__title">Nucleate Aging Biology</h3>
            <p class="hover-card__body">
              Co-founded and led a global thematic series; hosted panel with founders/VC; authored resource guides accompanying panel discussions.
            </p>
          </div>
        </a>

        <a class="hover-card cover-no-title" href="#"
           style="--bg: url('/images/cards/openbio.png'); --cover: rgba(120, 190, 255, 0.55);">
          <div class="hover-card__content">
            <h3 class="hover-card__title">Harvard OpenBio</h3>
            <p class="hover-card__body">
              Organized biosecurity journal club and speaker sessions; planned and co-hosted the Future of Biology Conference (130+ attendees).
              Co-led Harvard Summer Research Institute matching 73 underserved students to mentors and publishing abstracts.
            </p>
          </div>
        </a>

      </div>

  - title: 🏅 Honors and Awards
    layout: text
    content: |
      <span id="honors"></span>
      - TIME x Aoki Foundation Grant Recipient — 1 of 11 recipients; support to host Immune Aging Speaker series. 2026
      - John Harvard Scholar (top 5% of class). 2025
      - TIME Initiative Exploration Grant — 1 of 4 recipients; support to represent next-gen leaders at ARDD 2025. 2025
      - Herchel-Smith Fellow — Fellowship supporting independent research in the Buenrostro Lab; travel grant to present at ARDD. 2025
      - PRISE Fellow, Harvard Office of Undergraduate Research & Fellowships. 2024
      - Harvard College Research Program (HCRP) Grants (Twice Awarded). 2024
      - Congressional Award — Bronze Medalist, United States Congress. 2022
      - Jessie Chambers Scholarship, National Junior Classical League — 1 of 8 national recipients ($1,500). 2023
      - National Latin Exam Scholarship — 1 of 12 global recipients ($2,000). 2023

  - title: 📄 Publications and Presentations
    layout: text
    content: |
      <span id="publications"></span>
      - Dasariraju, S., Simonini, S., **<u>Mehra, E.</u>**, Fedorovskyy, M., Law, C., Khera, N., Rajagopal, K., & Orkaby, A. (2025). Aging Initiative: A Student-Led Model for Advancing Aging Research with a Translational Focus. Late-breaking poster presented at GSA Annual Scientific Meeting, Cambridge, MA.
      - Chan, K., Wang, J., Balakumar, A., Ng, M., **<u>Mehra, E.</u>**, Jain, L., Fischetti, C., Foody, J.N., Duggan, N.M., Goldsmith, A.J., & Allan-Blitz, L.-T. (2025). Using Machine Learning to Classify Manifestations of Extrapulmonary Tuberculosis with Point-of-Care Ultrasound: A Proof of Concept. The Ultrasound Journal. (under review).
      - **<u>Mehra, E.</u>**, Lu, L., Lin, H.-Y., Shiau, C.-K., Pan, T., & Gao, R. (2023). Delineating Cellular Ecosystem Dynamics from Renal Cell Carcinomas to Brain Metastases. Poster presented at the Lurie Cancer Research Center and Harvard University.
      - Emani, V., An, D., **<u>Mehra, E.</u>** (2025). A Digital Platform to Improve Access & Affordability of Trained Homecare Medical Nurses in India. Poster presented at Harvard University, Cambridge, MA.
      - **<u>Mehra, E.</u>** How the Power Shift in Healthcare from Providers to Insurers is Eroding Physician–Patient Relationships. 2023.

  - title: 🧪 Projects
    layout: text
    content: |
      <span id="projects"></span>
      <div class="hover-grid">

        <a class="hover-card cover-no-title"
        href="https://docs.google.com/document/d/1D8xeZBTMEZ8utR_p62iPLbYHhZFYc9NrCfbe8ss-NaI/edit?usp=sharing"
        target="_blank"
        rel="noopener"
        style="--bg: url('/images/cards/il2-aci.png'); --cover: rgba(255, 210, 120, 0.55);">

        <div class="hover-card__content">
          <h3 class="hover-card__title">Modeling IL-2 + ACI in Tumor Growth</h3>

          <p class="hover-card__body">
            Built and analyzed a systems model exploring dosing synergies between IL-2
            and adoptive cellular immunotherapy (ACI) to study tumor-growth dynamics.
          </p>
        </div>

        </a>

      </div>

