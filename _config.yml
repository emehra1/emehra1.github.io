  - title: 🔬 Laboratories
    layout: text
    content: |
      <span id="labs"></span>
      <div class="hover-grid">

        <a class="hover-card labs" href="https://www.buenrostrolab.com/" style="--bg: url('/images/cards/buenrostro.jpg');">
          <div class="hover-card__content">
            <h3 class="hover-card__title">Buenrostro Lab</h3>
            <p class="hover-card__body">
              Advised by Dr. Jason Buenrostro and Dr. Patrick Griffin, I am engineering a cost-effective, high-throughput single-cell methylation sequencing assay.
            </p>
          </div>
        </a>

        <a class="hover-card labs" href="https://www.syntheticimmunity.net/" style="--bg: url('/images/cards/synthetic-immunity.jpg');">
          <div class="hover-card__content">
            <h3 class="hover-card__title">Synthetic Immunity Lab</h3>
            <p class="hover-card__body">
              Advised by Dr. Ming-Ru Wu, I engineered T-cells with logic-gated induction of an immortalized “zombie T-cell” (zT-cell) state to overcome exhaustion in vivo.
            </p>
          </div>
        </a>

        <a class="hover-card labs" href="https://labs.feinberg.northwestern.edu/gao/index.html" style="--bg: url('/images/cards/gao-lab.jpg');">
          <div class="hover-card__content">
            <h3 class="hover-card__title">Gao Lab</h3>
            <p class="hover-card__body">
              Advised by Dr. Ruli Gao, I analyzed Nanopore scRNA-seq data of patient-matched renal cell carcinomas and brain metastases to map gene expression dynamics in brain-metastasis evolution for target identification.
            </p>
          </div>
        </a>

      </div>

