            <h3 class="hover-card__title">TIME Initiative</h3>
            <div class="hover-card__meta">
              <span><strong>Fellow; Director of TIME Cast</strong></span>
              <span>March 2025 – Present</span>
            </div>
            <p class="hover-card__body">
              Selected as 1 of 25 fellows supported by the Academy for Health &amp; Lifespan Research; represent youth in aging biology at major conferences across the world; network with pioneers in aging biology biotech, academia, and venture capital; host podcast episodes with leaders in aging biology.
            </p>
          </div>
        </a>

        <a class="hover-card" href="#" style="--bg: url('/images/cards/norn.jpg');">
          <div class="hover-card__content">
            <h3 class="hover-card__title">Nexus Fellowship</h3>
            <div class="hover-card__meta">
              <span><strong>Fellow</strong></span>
              <span>February 2025 – Present</span>
            </div>
            <p class="hover-card__body">
              Drive translational efforts in age-related disease by leading journal clubs, drafting policy memos, and designing/securing funding for novel experiments.
            </p>
          </div>
        </a>

        <a class="hover-card" href="#" style="--bg: url('/images/cards/foa-summit.png');">
          <div class="hover-card__content">
            <h3 class="hover-card__title">Future of Aging Summit</h3>
            <div class="hover-card__meta">
              <span><strong>Co-Founder and Co-Host</strong></span>
              <span>January 2024 – Present</span>
            </div>
            <p class="hover-card__body">
              Hosting an interdisciplinary summit on aging at the annual Gerontological Society of America (GSA) 2025 with expected 100+ attendees; leading and hosting Clinical Research in Aging and Biotech’s Role in Aging Panel
            </p>
          </div>
        </a>

        <a class="hover-card" href="#" style="--bg: url('/images/cards/aging-initiative.png');">
          <div class="hover-card__content">
            <h3 class="hover-card__title">Aging Initiative at Harvard</h3>
            <div class="hover-card__meta">
              <span><strong>Vice President of Partnerships</strong></span>
              <span>October 2023 – Present</span>
            </div>
            <p class="hover-card__body">
              Spearheaded the Muscle Aging Science and Translation (MAST) Symposium (April 2024), the largest muscle aging conference in the world including speakers David Glass, Andrew Adams, Anne-Ulrike Trendelenburg and Boston’s largest aging-biology mixer (Nov 2024) including speakers George Church, Alex Colville, and Jesse Poganik.
              Co-lead a team of 27; manage partnerships with other companies and advisory board members including George Church, Martin Borch Jensen, Laza Nuzhna, and Jake Becraft; raised $10,000+ through industry outreach.
              Lead professor-dinner series and events with MIT/Harvard researchers (e.g., Jonathan Gootenberg, Omar Abudayyeh).
            </p>
          </div>
        </a>

        <a class="hover-card" href="#" style="--bg: url('/images/cards/gami.jpeg');">
          <div class="hover-card__content">
            <h3 class="hover-card__title">GAMI</h3>
            <div class="hover-card__meta">
              <span><strong>Research &amp; Development Co-Lead</strong></span>
              <span>February 2024 – Present</span>
            </div>
            <p class="hover-card__body">
              Building a nurse-patient matching mobile app for elderly patients in rural India with Udaya Kumar and ISER Tirupati partners; mapping delivery bottlenecks and spearheading pilot implementation.
            </p>
          </div>
        </a>

        <a class="hover-card" href="#" style="--bg: url('/images/cards/nucleate.png');">
          <div class="hover-card__content">
            <h3 class="hover-card__title">Nucleate Aging Biology</h3>
