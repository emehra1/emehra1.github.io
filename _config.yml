            <p class="hover-card__body">
              Founded a three-evening symposium at The Engine convening ~100 leaders across academia, biotech, pharma, and venture on immune targets in chronic disease. Wrote the series' scientific primer on where immune aging is causal rather than merely correlated. Funded by the Aoki Foundation and TIME Initiative.
            </p>
          </div>
        </div>

        <a class="hover-card cover-no-title" href="https://aging-initiative.org/" style="--bg: url('/images/cards/aging-initiative.jpg');">
